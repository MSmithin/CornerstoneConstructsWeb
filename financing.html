<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financing Options - Cornerstone Constructs</title>
    <meta name="description" content="Flexible financing options for your home improvement projects in North Bay.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="Favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="Favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="Favicon/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="Favicon/android-chrome-512x512.png">
    <link rel="manifest" href="Favicon.site.webmanifest">
    <link rel="icon" href="Favicon/favicon.ico">
    <style>
        :root {
            --primary-orange: #FF914D;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            line-height: 1.7;
            color: #222;
            background: #f8f9fa;
        }
        


        /* Mobile view - hide desktop nav, show hamburger */
        @media (max-width: 768px) {
            
            .hero-content h1 { 
                font-size: 2.8rem; 
            }
        }

        /* Financing Page Content */
        .financing-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
            text-align: center;
        }
        
        .coming-soon {
            max-width: 800px;
            margin: 4rem auto;
            background: white;
            padding: 5rem 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .coming-soon h1 {
            font-size: 3rem;
            color: var(--primary-orange);
            margin-bottom: 1.5rem;
        }
        
        .coming-soon p {
            font-size: 1.3rem;
            line-height: 1.8;
            color: #444;
            max-width: 600px;
            margin: 0 auto 2.5rem;
        }
        
        .icon {
            font-size: 5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        
        
        @media (max-width: 768px) {
            .coming-soon {
                padding: 3rem 1.5rem;
            }
            .coming-soon h1 {
                font-size: 2.4rem;
            }
        }
        /* ==================== MOBILE RESPONSIVE TWEAKS ==================== */
        @media (max-width: 768px) {

            
            /* Hero adjustments */
            .hero {
                height: auto;
                min-height: 430px;
                padding: 2.5rem 0 4rem 0;
            }
            
            .hero-content {
                padding: 0 1.2rem;
            }
            
            .hero-content h1 {
                font-size: 2.15rem;
                line-height: 1.1;
                margin-bottom: 1rem;
            }
            
            .hero-content p {
                font-size: 1.1rem;
                margin-bottom: 1.8rem;
            }
            
            .btn-euroshield {
                margin-bottom: 2.5rem;
            }
            
            /* Services spacing */
            .services-section {
                padding: 3rem 1rem 4rem;
            }
            
            .services-section h2 {
                font-size: 2.2rem;
                margin-bottom: 3.2rem;
            }
            
        }
        
        /* Extra small screens */
        @media (max-width: 480px) {
           
            
            .hero-content h1 {
                font-size: 2.25rem;
            }
        }

        
    </style>
</head>
<body>



    <div class="financing-container">
        <div class="coming-soon">
            <div class="icon">🔨</div>
            <h1>Financing Options Coming Soon</h1>
            <p>
                We're currently finalizing flexible financing partnerships to make your home improvement projects even more affordable.<br><br>
                Please check back soon or call us directly — we'd be happy to discuss available options with you right now.
            </p>
            <button onclick="alert('Call us at: (705) 825 7196')" 
                    style="background:var(--primary-orange); color:white; border:none; padding:1rem 2.5rem; font-size:1.1rem; font-weight:700; border-radius:8px; cursor:pointer; margin-top:1rem;">
                Call Us Now: (705) 825-7196
            </button>
        </div>
    </div>

   
    <script src="page-loader.js"></script>
    <script src="Header/header.js"></script>
    <script src="Footer/footer.js"></script>

</body>
</html>

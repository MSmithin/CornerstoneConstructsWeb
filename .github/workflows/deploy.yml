name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]   # or master, if that’s your default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ↓↓↓ THIS is the step that was missing ↓↓↓
      - name: Inject Google Places API key
        run: |
          sed -i "s|YOUR_GOOGLE_PLACES_API_KEY|${{ secrets.GOOGLE_PLACES_API_KEY }}|g" index1.html
          # If the file lives in a subfolder, use e.g. path/to/index.html instead

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # or the folder that contains index.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
